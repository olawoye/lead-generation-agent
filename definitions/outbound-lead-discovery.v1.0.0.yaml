apiVersion: "agent.definition/v1"
kind: AgentDefinition

metadata:
  name: outbound-lead-discovery
  displayName: "Outbound Lead Discovery Agent"
  version: "1.0.0"
  description: >
    A declarative 10-step outbound lead-discovery workflow for finding,
    qualifying, enriching, and prioritising businesses or individuals likely to
    need a SaaS product or service in a target geography.
  tags:
    - lead-generation
    - outbound
    - b2b
    - sales-development
    - declarative-agent
  author: "olawoye"
  license: MIT

spec:
  objective:
    summary: >
      Discover, enrich, and qualify outbound leads that closely match the target
      ICP, with progressive record enrichment and a final priority score.
    context: >
      This definition describes the business workflow independently from the
      runtime, AI provider, or MCP implementation. It focuses on the logic of
      finding candidate companies and contacts, validating intent signals, and
      enriching records without hard-coded execution in TypeScript.
    successCriteria:
      - "At least `options.minLeads` qualified leads are produced for each run."
      - "Each lead record includes a normalized company, contact, provenance evidence, and confidence score."
      - "All outputs are deduplicated by domain and person identity."
      - "Each step validates its own quality gates before passing records downstream."
      - "The final output is a prioritized, enriched list ready for outreach."

  orar:
    objective: >
      Build a ranked, evidence-backed prospect list that matches the target ICP in
      the target geography and demonstrates buying intent or service need.
    resources:
      - "Target ICP and geo constraints supplied in options"
      - "Search and discovery capabilities across public web, directories, registers, marketplaces, and websites"
      - "Technology and competitive intelligence signals"
      - "Structured enrichment sources for firmographics, contacts, and buying intent"
      - "Shared lead state for deduplication, evidence, confidence, and scoring"
    actions:
      - "Parse and validate the ICP brief and geography"
      - "Search for candidate companies and individuals across discovery channels"
      - "Mine structured directories and public records"
      - "Analyze website and technology signals"
      - "Identify buying signals and intent triggers"
      - "Enrich records with firmographic and contact data"
      - "Normalize and deduplicate the shared lead state"
      - "Score, qualify, and prioritize leads"
    results:
      - "A normalized and deduplicated lead dataset"
      - "Evidence-backed company and contact records with provenance and confidence"
      - "A ranked output list with final qualification and priority scores"
      - "A runtime-agnostic definition reusable across runtimes and applications"

  state:
    dedupeKeys:
      - domain
      - email
      - company_name
    leadRecord:
      type: object
      properties:
        company:
          type: object
          description: "Canonical company record with firmographics, domain, and source evidence."
          required: true
        person:
          type: object
          description: "Canonical person or contact record with contact details and decision-maker data."
          required: false
        buying_signals:
          type: array
          description: "Buying-intent and trigger-based signals that indicate likely need."
        confidence:
          type: number
          description: "Overall confidence score for the record from 0 to 1."
          required: true
        provenance:
          type: array
          description: "Evidence records including URLs, timestamps, and source metadata."
          required: true
        qualification_score:
          type: number
          description: "Final lead qualification score from 0 to 100."
          required: true
    finalLeadOutput:
      type: object
      description: "Final aggregated output contract for the end-of-flow CRM-ready lead list."
      properties:
        qualified_leads:
          type: array
          description: "A cumulative list of normalized leads discovered across free and paid stages."
          items:
            type: object
            properties:
              full_name:
                type: string
              company_name:
                type: string
              title:
                type: string
              email:
                type: string
              website_url:
                type: string
              source:
                type: string
              confidence:
                type: number
              qualification_score:
                type: number
              provenance:
                type: array

  options:
    required:
      - brief
      - geography
      - outputPath
    properties:
      brief:
        type: string
        description: "Simple business brief or ICP description for the outbound search."
      geography:
        type: object
        description: "Geographic constraints such as city, region, country, radius, and locale."
        properties:
          city:
            type: string
          state:
            type: string
          country:
            type: string
          radius_km:
            type: integer
            minimum: 0
        additionalProperties: true
      outputPath:
        type: string
        description: "Destination path for the final lead list output."
      minLeads:
        type: integer
        description: "Minimum number of leads to produce before the run is considered successful."
        minimum: 1
        default: 25
      maxLeads:
        type: integer
        description: "Maximum number of records to include in the final ranked list."
        minimum: 1
        default: 100
      minQualificationScore:
        type: integer
        description: "Minimum qualification/priority threshold needed for final inclusion."
        minimum: 0
        maximum: 100
        default: 50
      languages:
        type: array
        description: "Languages that should be considered during discovery."
        items:
          type: string
        default: ["en"]
      countries:
        type: array
        description: "Target countries or subregions for discovery."
        items:
          type: string
      maxResultsPerStep:
        type: integer
        description: "Maximum candidate results a step should accumulate before validation."
        minimum: 1
        default: 500

  policies:
    maxRetries: 3
    timeoutSeconds: 600
    rateLimiting:
      requestsPerMinute: 30
      concurrentSteps: 2
    privacy:
      maskPII: false
      retentionDays: 30
    errorHandling: continue-on-error

  tools:
    - id: web_search
      description: "Search the public web for candidate companies and people matching the ICP."
      capabilities:
        - web_search
        - web-search
      optional: false

    - id: maps_search_places
      description: "Resolve geo locations, service area data, and local business presence."
      capabilities:
        - maps_search_places
        - maps-search
      optional: false

    - id: company_directory_search
      description: "Query business directories and professional listings for candidate entities."
      capabilities:
        - company_directory_search
        - business-directory
      optional: false

    - id: person_directory_search
      description: "Query professional and people directories for founders, executives, and decision-makers."
      capabilities:
        - person_directory_search
        - people-discovery
      optional: false

    - id: public_records_search
      description: "Search public registries, business registers, and open data sources for company signals."
      capabilities:
        - public-record-search
        - business-registry-access
      optional: false

    - id: marketplace_search
      description: "Search marketplaces and platform listings for service and business activity."
      capabilities:
        - marketplace-discovery
        - platform-search
      optional: false

    - id: website_research
      description: "Assess company websites, service offerings, product pages, and CTA signals."
      capabilities:
        - website-analysis
        - content-scrape
      optional: false

    - id: detect_technologies
      description: "Identify technology and product indicators on company websites or online properties."
      capabilities:
        - technology-detection
        - detect_technologies
      optional: false

    - id: competitive_intelligence_search
      description: "Search for competitors, market activity, and expansion or service signals."
      capabilities:
        - market-intelligence
        - competitive-analysis
      optional: false

    - id: events_search
      description: "Search for events, communities, and local business ecosystems relevant to the ICP."
      capabilities:
        - event-discovery
        - community-lookup
      optional: false

    - id: signal_monitoring
      description: "Look for trigger-based signals such as hiring, funding, launches, or business expansion."
      capabilities:
        - intent-signal-detection
        - trigger-monitoring
      optional: false

    - id: enrich_company
      description: "Enhance company records with firmographic, operational, and technology metadata."
      capabilities:
        - company-enrichment
        - enrich_company
      optional: false

    - id: enrich_person
      description: "Enhance person records with contact details, role information, and reachability insights."
      capabilities:
        - person-enrichment
        - enrich_person
      optional: false

    - id: lead_scoring
      description: "Compute qualification and priority scores for enriched leads."
      capabilities:
        - lead-scoring
        - prioritization
      optional: false

  steps:
    - id: search_engine_prospecting
      name: "Search Engine Prospecting"
      description: >
        Search public web results for businesses and people who match the target
        ICP and geography.
      enabled: true
      objective: "Discover candidate businesses matching the ICP and local geography."
      dependsOn: []
      tools:
        - web_search
        - maps_search_places
      inputs:
        - icp
        - geography
      configuration:
        queries: []
        max_results: 500
        countries: []
        languages:
          - en
      inputHints:
        - keywords
        - industry
        - location
        - excludeJobBoards
      queryStrategy: "local-service-intent"
      queryTemplates:
        - '"${industry}" "${city}" "${service}" -job -salary -resume -cv'
        - '"${industry}" in ${city} business directory -job -salary'
        - '"${industry}" ${city} companies near me -job -salary'
      negativeTerms:
        - job
        - salary
        - resume
        - cv
        - careers
      entityFocus: company
      extractionContract:
        target: company
        fields:
          - company_name
          - domain
          - website_url
          - location
          - industry
        mode: llm
        requiredFields:
          - company_name
        outputKey: candidate_companies
      outputs:
        - prospect_records
      next_steps:
        - directory_mining
        - website_technology_discovery
      quality_rules:
        - id: search_result_relevance
          rule: "candidate_has_name_or_domain"
          severity: "error"
          message: "Every discovered record must include a candidate name or domain."
      retry_policy:
        max_attempts: 3
        backoff_ms: 1000
        backoff_multiplier: 2
        max_backoff_ms: 20000
        retry_on:
          - timeout
          - rate_limit

    - id: directory_mining
      name: "Business & Professional Directory Mining"
      description: >
        Query structured directories and professional listings to recover more
        candidate records and service providers.
      enabled: true
      objective: "Find credible business records in structured directories and listing sources."
      dependsOn:
        - search_engine_prospecting
      tools:
        - company_directory_search
      inputs:
        - icp
        - geography
      configuration:
        providers: []
        max_results: 300
      inputHints:
        - companyName
        - location
        - industry
      queryStrategy: "directory-entity-confirmation"
      queryTemplates:
        - '"${company_name}" "${city}" business directory'
        - '"${industry}" "${city}" companies'
      negativeTerms:
        - job
        - vacancy
        - career
      entityFocus: company
      extractionContract:
        target: company
        fields:
          - company_name
          - domain
          - website_url
          - city
          - state
          - country
        mode: llm
        requiredFields:
          - company_name
        outputKey: candidate_companies
      outputs:
        - directory_records
      next_steps:
        - public_data_prospecting
        - website_technology_discovery
      quality_rules:
        - id: directory_record_validity
          rule: "record_has_business_name_or_url"
          severity: "error"
          message: "Directory records must include a business name or URL."
      retry_policy:
        max_attempts: 3
        backoff_ms: 1000
        backoff_multiplier: 2
        max_backoff_ms: 15000
        retry_on:
          - timeout
          - service_unavailable

    - id: public_data_prospecting
      name: "Public Data & Open Registers"
      description: >
        Check public registers, company registries, and open data sources for legal,
        operational, and local business indicators.
      enabled: true
      objective: "Validate business existence, registration, and local footprint in public data."
      dependsOn:
        - directory_mining
      tools:
        - public_records_search
      inputs:
        - icp
        - geography
        - prospect_records
      configuration:
        include_registries: true
        max_results: 250
      queryStrategy: "registry-validation"
      queryTemplates:
        - '"${company_name}" ${city} company registration'
        - '"${company_name}" legal entity registry ${country}'
      negativeTerms:
        - salary
        - jobs
        - recruitment
      entityFocus: company
      extractionContract:
        target: company
        fields:
          - company_name
          - domain
          - registry_id
          - legal_name
          - country
        mode: schema
        requiredFields:
          - company_name
        outputKey: registry_companies
      outputs:
        - public_records
      next_steps:
        - marketplace_prospecting
        - website_technology_discovery
      quality_rules:
        - id: public_data_coverage
          rule: "record_has_source_url_or_registry_id"
          severity: "warning"
          message: "Public records should include source URL or registry identifier when available."
      retry_policy:
        max_attempts: 3
        backoff_ms: 1200
        backoff_multiplier: 2
        max_backoff_ms: 20000
        retry_on:
          - timeout
          - rate_limit

    - id: marketplace_prospecting
      name: "Marketplace & Platform Prospecting"
      description: >
        Search marketplaces and platform listings for relevant businesses, service
        categories, or vendor activity in the target market.
      enabled: true
      objective: "Identify demand-side activity and business presence in relevant platforms."
      dependsOn:
        - public_data_prospecting
      tools:
        - marketplace_search
      inputs:
        - icp
        - geography
      configuration:
        categories: []
        max_results: 200
      queryStrategy: "platform-demand-signal"
      queryTemplates:
        - '"${industry}" "${city}" service providers'
        - '"${industry}" "${city}" vendor OR company'
      negativeTerms:
        - jobs
        - salary
        - resume
      entityFocus: company
      extractionContract:
        target: company
        fields:
          - company_name
          - website_url
          - domain
          - city
          - service_offer
        mode: llm
        requiredFields:
          - company_name
        outputKey: marketplace_companies
      outputs:
        - marketplace_records
      next_steps:
        - website_technology_discovery
        - geographic_territory_prospecting
      quality_rules:
        - id: marketplace_signal_required
          rule: "platform_record_has_name_or_url"
          severity: "error"
          message: "Marketplace records must include a recognizable name or URL."
      retry_policy:
        max_attempts: 2
        backoff_ms: 1000
        backoff_multiplier: 2
        max_backoff_ms: 10000
        retry_on:
          - timeout

    - id: website_technology_discovery
      name: "Website & Technology Discovery"
      description: >
        Analyze websites and online technology signals to determine product/service
        relevance and likely buying intent.
      enabled: true
      objective: "Assess each opportunity's website, service relevance, and technology footprint."
      dependsOn:
        - search_engine_prospecting
        - directory_mining
        - public_data_prospecting
        - marketplace_prospecting
      tools:
        - website_research
        - detect_technologies
      inputs:
        - prospect_records
        - directory_records
        - public_records
        - marketplace_records
      configuration:
        max_pages: 5
        detect_ctas: true
        min_technology_signal_score: 0.4
      inputHints:
        - domain
        - url
        - companyName
      queryStrategy: "website-fit-analysis"
      queryTemplates:
        - 'site:${domain} "${industry}" "${city}"'
        - '"${company_name}" services pricing contact'
      negativeTerms:
        - jobs
        - careers
        - recruiting
      entityFocus: company
      extractionContract:
        target: company
        fields:
          - company_name
          - domain
          - website_url
          - service_offerings
          - cta_type
          - technology_signals
        mode: llm
        requiredFields:
          - company_name
          - domain
        outputKey: website_candidates
      outputs:
        - website_signals
        - technology_signals
      next_steps:
        - competitive_intelligence_prospecting
        - geographic_territory_prospecting
      quality_rules:
        - id: website_signal_validity
          rule: "signal_has_evidence"
          severity: "warning"
          message: "Website signals should include positive evidence from page content or structure."
      retry_policy:
        max_attempts: 3
        backoff_ms: 1500
        backoff_multiplier: 2
        max_backoff_ms: 20000
        retry_on:
          - timeout
          - http_429

    - id: geographic_territory_prospecting
      name: "Geographic & Territory Prospecting"
      description: >
        Validate whether the company is active in the target region and whether the
        service area or local geography matches the sales objective.
      enabled: true
      objective: "Confirm the target geography and local service footprint for each prospect."
      dependsOn:
        - marketplace_prospecting
      tools:
        - maps_search_places
      inputs:
        - icp
        - geography
        - prospect_records
      configuration:
        radius_km: 50
        include_local_presence: true
      queryStrategy: "location-fit-check"
      queryTemplates:
        - '"${company_name}" "${city}" location'
        - '"${industry}" near ${city}'
      negativeTerms:
        - remote-only
        - global
      entityFocus: company
      extractionContract:
        target: company
        fields:
          - company_name
          - city
          - state
          - country
          - service_area
        mode: schema
        requiredFields:
          - company_name
        outputKey: territory_candidates
      outputs:
        - territory_records
      next_steps:
        - competitive_intelligence_prospecting
        - event_community_prospecting
      quality_rules:
        - id: geography_match
          rule: "location_match_required_when_geo_filter_set"
          severity: "warning"
          message: "Geographic fit should be checked when a local or regional filter is supplied."
      retry_policy:
        max_attempts: 2
        backoff_ms: 800
        backoff_multiplier: 2
        max_backoff_ms: 12000
        retry_on:
          - timeout

    - id: competitive_intelligence_prospecting
      name: "Competitive Intelligence Prospecting"
      description: >
        Look for market activity, competitor presence, adjacent category signals,
        and service demand cues that indicate readiness or need.
      enabled: true
      objective: "Identify competitive or adjacent signal strength that indicates likely need."
      dependsOn:
        - website_technology_discovery
        - geographic_territory_prospecting
      tools:
        - competitive_intelligence_search
      inputs:
        - prospect_records
        - website_signals
        - technology_signals
      configuration:
        max_results: 200
        categories: []
      queryStrategy: "adjacent-market-competitor-intent"
      queryTemplates:
        - '"${industry}" "${city}" competitors'
        - '"${company_name}" expansion growth ${city}'
      negativeTerms:
        - jobs
        - hiring
        - salary
      entityFocus: company
      extractionContract:
        target: company
        fields:
          - company_name
          - domain
          - website_url
          - market_signal
          - location
        mode: llm
        requiredFields:
          - company_name
        outputKey: competition_candidates
      outputs:
        - competition_records
      next_steps:
        - event_community_prospecting
        - intent_trigger_based_prospecting
      quality_rules:
        - id: competitive_signal_present
          rule: "market_signal_or_rival_presence_exists"
          severity: "warning"
          message: "A competitive signal increases score but is not required to continue."
      retry_policy:
        max_attempts: 2
        backoff_ms: 1200
        backoff_multiplier: 2
        max_backoff_ms: 15000
        retry_on:
          - timeout
          - rate_limit

    - id: event_community_prospecting
      name: "Event & Community Prospecting"
      description: >
        Search events, communities, and local ecosystems to find businesses or
        founders that may be actively building or scaling.
      enabled: true
      objective: "Find signals from communities and events that suggest a business is active or in growth mode."
      dependsOn:
        - geographic_territory_prospecting
        - competitive_intelligence_prospecting
      tools:
        - events_search
      inputs:
        - icp
        - geography
        - prospect_records
      configuration:
        event_types: []
        max_results: 150
      queryStrategy: "event-driven-community-intent"
      queryTemplates:
        - '"${industry}" conference ${city}'
        - '"${industry}" meetup ${city}'
        - '"${service}" networking ${city}'
      negativeTerms:
        - job fair
        - recruitment
        - careers
      entityFocus: event
      extractionContract:
        target: event
        fields:
          - event_name
          - event_url
          - organizer_name
          - venue_name
          - city
          - start_date
        mode: llm
        requiredFields:
          - event_name
        outputKey: event_candidates
      outputs:
        - event_records
      next_steps:
        - intent_trigger_based_prospecting
        - lead_enrichment_qualification
      quality_rules:
        - id: event_signal_relevance
          rule: "event_record_has_name_or_date"
          severity: "warning"
          message: "Event records should contain a name or date where possible."
      retry_policy:
        max_attempts: 2
        backoff_ms: 1000
        backoff_multiplier: 2
        max_backoff_ms: 12000
        retry_on:
          - timeout

    - id: intent_trigger_based_prospecting
      name: "Intent & Trigger-Based Prospecting"
      description: >
        Detect intent triggers such as hiring, funding, launch activity, growth,
        or expansion signals that indicate buying readiness.
      enabled: true
      objective: "Identify behavioral or market triggers that improve the chance of a relevant conversation."
      dependsOn:
        - competitive_intelligence_prospecting
        - event_community_prospecting
      tools:
        - signal_monitoring
      inputs:
        - prospect_records
        - geography
        - technology_signals
      configuration:
        trigger_types:
          - hiring
          - funding
          - launch
          - expansion
        max_results: 200
      queryStrategy: "trigger-signal-monitoring"
      queryTemplates:
        - '"${company_name}" hiring expansion launch ${city}'
        - '"${industry}" growth funding ${city}'
      negativeTerms:
        - jobs
        - salary
        - resume
      entityFocus: signal
      extractionContract:
        target: signal
        fields:
          - company_name
          - trigger_type
          - evidence_url
          - signal_date
          - source
        mode: llm
        requiredFields:
          - company_name
          - trigger_type
        outputKey: signal_candidates
      outputs:
        - intent_records
      next_steps:
        - lead_enrichment_qualification
      quality_rules:
        - id: trigger_signal_present
          rule: "signal_has_trigger_type_and_evidence"
          severity: "warning"
          message: "Intent triggers should contain a clear business trigger and supporting evidence."
      retry_policy:
        max_attempts: 3
        backoff_ms: 1200
        backoff_multiplier: 2
        max_backoff_ms: 20000
        retry_on:
          - timeout
          - rate_limit

    - id: lead_enrichment_qualification
      name: "Lead Enrichment & Qualification"
      description: >
        Enrich final leads with company and contact data, normalize the shared state,
        and score them to determine final outreach priority.
      enabled: true
      objective: "Normalize, enrich, deduplicate, score, and prioritize the final lead dataset."
      dependsOn:
        - event_community_prospecting
        - intent_trigger_based_prospecting
      tools:
        - enrich_company
        - enrich_person
        - lead_scoring
      inputs:
        - prospect_records
        - directory_records
        - public_records
        - marketplace_records
        - website_signals
        - technology_signals
        - territory_records
        - competition_records
        - event_records
        - intent_records
      configuration:
        min_qualification_score: 50
        max_results: 100
        deduplicate_by:
          - domain
          - email
          - company_name
      inputHints:
        - companyName
        - domain
        - fullName
        - title
      outputHints:
        - qualifiedLeads
      queryStrategy: "final-normalization-and-prioritization"
      queryTemplates: []
      negativeTerms: []
      entityFocus: lead
      extractionContract:
        target: lead
        fields:
          - full_name
          - title
          - email
          - company_name
          - website_url
          - domain
          - confidence
          - qualification_score
          - provenance
        mode: llm
        requiredFields:
          - company_name
          - confidence
        outputKey: qualified_leads
      outputs:
        - qualified_leads
      next_steps: []
      quality_rules:
        - id: normalized_record_required
          rule: "lead_has_company_and_confidence_score"
          severity: "error"
          message: "Each final lead must have a normalized company and a qualification score."
        - id: deduplication_complete
          rule: "duplicate_domains_removed"
          severity: "error"
          message: "Final output must not contain duplicate domains or duplicate lead identities."
      retry_policy:
        max_attempts: 3
        backoff_ms: 1500
        backoff_multiplier: 2
        max_backoff_ms: 25000
        retry_on:
          - timeout
          - rate_limit

